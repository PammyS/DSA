name: Auto PR to masterB

on:
  pull_request:
    types: [opened]
    branches:
      - masterA

jobs:
  create-mirror-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/install.sh | sh

      - name: Check and create PR to masterB
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Checking for existing PR to masterB..."

          # Extract branch name (remove refs/heads/)
          SOURCE_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "Source branch: $SOURCE_BRANCH"

          # Check for existing PR from this branch to masterB
          existing_pr=$(gh pr list --base masterB --head "$SOURCE_BRANCH" --json number --jq '.[0].number')

          if [[ -n "$existing_pr" ]]; then
            echo "PR #$existing_pr to masterB already exists for branch $SOURCE_BRANCH"
            exit 0
          fi

          # Create new PR to masterB
          echo "Creating new PR to masterB..."
          gh pr create \
            --base masterB \
            --head "$SOURCE_BRANCH" \
            --title "Auto PR to masterB for $SOURCE_BRANCH" \
            --body "This PR was automatically created to keep masterB in sync with masterA for branch \`$SOURCE_BRANCH\`."
