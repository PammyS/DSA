name: Auto PR to masterB

on:
  pull_request:
    types: [opened]
    branches:
      - masterA

jobs:
  create-mirror-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check and create PR to masterB
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Checking for existing PR to masterB..."

          # Use GitHub CLI to check for an existing PR
          gh auth login --with-token <<< "$GH_TOKEN"
          gh pr list --base masterB --head "$PR_BRANCH" --repo "$REPO" > existing_prs.txt
          if [[ -s existing_prs.txt ]]; then
            echo "PR to masterB already exists for $PR_BRANCH"
            exit 0
          fi

          echo "Creating new PR to masterB..."
          gh pr create \
            --repo "$REPO" \
            --base masterB \
            --head "$PR_BRANCH" \
            --title "Auto PR to masterB for $PR_BRANCH" \
            --body "This PR was automatically created to keep masterB in sync with masterA for branch $PR_BRANCH."
