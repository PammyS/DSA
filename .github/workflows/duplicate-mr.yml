- name: Check and create PR to masterB
  env:
    GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Ensure the secret is available
  run: |
    echo "Checking for existing PR to masterB..."
    
    # Clear any existing token from environment
    unset GH_TOKEN

    # Login to GitHub CLI using the secret token and configure it to store the credentials
    echo "$GH_TOKEN" | gh auth login --with-token

    # Now check for existing PR to masterB
    gh pr list --base masterB --head "$GITHUB_REF" --repo "$GITHUB_REPOSITORY" > existing_prs.txt
    if [[ -s existing_prs.txt ]]; then
      echo "PR to masterB already exists for $GITHUB_REF"
      exit 0
    fi

    # If no existing PR, create one to masterB
    echo "Creating new PR to masterB..."
    gh pr create \
      --repo "$GITHUB_REPOSITORY" \
      --base masterB \
      --head "$GITHUB_REF" \
      --title "Auto PR to masterB for $GITHUB_REF" \
      --body "This PR was automatically created to keep masterB in sync with masterA for branch $GITHUB_REF."
