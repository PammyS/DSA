name: Auto PR to masterB

on:
  pull_request:
    types: [opened]
    branches:
      - masterA

jobs:
  create-mirror-pr:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository to access the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install GitHub CLI (gh)
      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/install.sh | sh

      # Step 3: Check if a corresponding PR already exists for masterB and create it if not
      - name: Check and create PR to masterB
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Ensure GH_TOKEN is available for authentication
        run: |
          echo "Checking for existing PR to masterB..."

          # Unset GH_TOKEN to avoid conflicts with any previous tokens in the environment
          unset GH_TOKEN

          # Log into GitHub CLI using the GH_TOKEN and store the credentials
          echo "$GH_TOKEN" | gh auth login --with-token

          # Check if a PR from the same branch already exists targeting masterB
          gh pr list --base masterB --head "$GITHUB_REF" --repo "$GITHUB_REPOSITORY" > existing_prs.txt

          if [[ -s existing_prs.txt ]]; then
            echo "PR to masterB already exists for branch $GITHUB_REF"
            exit 0
          fi

          # If no existing PR to masterB, create one from the same branch
          echo "Creating new PR to masterB..."
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base masterB \
            --head "$GITHUB_REF" \
            --title "Auto PR to masterB for $GITHUB_REF" \
            --body "This PR was automatically created to keep masterB in sync with masterA for branch $GITHUB_REF."
